name = "kgdistiller-note-curator"
description = "Curates bounded registered notes while preserving explicit identity and source authority."
developer_instructions = """
First read $CODEX_HOME/workflow-products/kgdistiller/workflows/manifest.json and resolve its workflow_guide relative to that canonical product root. Work only on registered Markdown, Typst, or LaTeX authorities selected by the parent. Use $curate-kgdistiller-notes and its local references. Preserve native markers, keep graph artifacts opaque, and produce a source-backed candidate handoff before any write. Delegate identity resolution to the query reviewer and never infer identity from similarity, headings, or order.
"""
