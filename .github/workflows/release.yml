name: Release Obsidian plugin

on:
  push:
    tags: ["[0-9]*.[0-9]*.[0-9]*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Existing tag matching manifest.version, without a v prefix"
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PLUGIN_VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version || github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: integrations/obsidian/package-lock.json
      - run: node scripts/build-obsidian-plugin.mjs --verify-only --tag "$PLUGIN_VERSION"
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Publish versioned plugin assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const m=JSON.parse(fs.readFileSync("manifest.json","utf8")); fs.writeFileSync("release-notes.md", fs.readFileSync(".github/obsidian-release-notes.md", "utf8") + `\nRequires Obsidian ${m.minAppVersion} or newer. Install assets: main.js, manifest.json, styles.css.\n`);'
          gh release create "$PLUGIN_VERSION" main.js manifest.json styles.css \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "kgdistiller Obsidian $PLUGIN_VERSION" --notes-file release-notes.md
