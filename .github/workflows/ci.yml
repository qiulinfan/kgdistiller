name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-resolution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - name: Resolve all extras across supported Python versions
        run: uv lock --check --no-sources

  obsidian-plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/obsidian
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: integrations/obsidian/package-lock.json
      - run: node ../../scripts/build-obsidian-plugin.mjs --verify-only
      - run: npm ci
      - run: npm run check
      - name: Validate installable plugin files
        run: test -s main.js && test -s manifest.json && test -s styles.css
      - name: Upload plugin bundle
        uses: actions/upload-artifact@v4
        with:
          name: kgdistiller-obsidian
          path: |
            integrations/obsidian/main.js
            integrations/obsidian/manifest.json
            integrations/obsidian/styles.css
          if-no-files-found: error

  linux-versions:
    needs: [dependency-resolution, obsidian-plugin]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - name: Use a temporary kgdistiller home, never the runner user's ~/.knowledge
        shell: bash
        run: echo "KGDISTILLER_HOME=$RUNNER_TEMP/kgdistiller-home" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - name: Download built Obsidian plugin
        uses: actions/download-artifact@v4
        with:
          name: kgdistiller-obsidian
          path: integrations/obsidian
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Lint
        run: uv run --locked ruff check src tests scripts
      - run: uv run --locked python -m unittest discover -s tests -v
      - run: uv build --out-dir build/release
      - run: uv run --locked python scripts/check_distribution.py --dist-root build/release
      - name: Wheel smoke test
        run: |
          wheel=$(find build/release -name 'kgdistiller-*.whl' -print -quit)
          uv venv .wheel-smoke
          uv pip install --python .wheel-smoke/bin/python "$wheel"
          .wheel-smoke/bin/kgdistiller --help
          .wheel-smoke/bin/python -c "from importlib.resources import files; assert files('kgdistiller').joinpath('schemas/kgdistiller-ingest-request-v1.schema.json').is_file()"
          .wheel-smoke/bin/python scripts/smoke_installed_runtime.py

  windows:
    needs: [dependency-resolution, obsidian-plugin]
    runs-on: windows-latest
    steps:
      - name: Use a temporary kgdistiller home, never the runner user's ~/.knowledge
        shell: bash
        run: echo "KGDISTILLER_HOME=$RUNNER_TEMP/kgdistiller-home" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - name: Download built Obsidian plugin
        uses: actions/download-artifact@v4
        with:
          name: kgdistiller-obsidian
          path: integrations/obsidian
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv run --locked python -m unittest discover -s tests -v
      - run: uv build --out-dir build/release
      - run: uv run --locked python scripts/check_distribution.py --dist-root build/release
      - name: Wheel smoke test
        shell: pwsh
        run: |
          $wheel = Get-ChildItem build/release -Filter 'kgdistiller-*.whl' | Select-Object -First 1
          if ($null -eq $wheel) { throw 'built wheel was not found' }
          uv venv .wheel-smoke
          uv pip install --python .wheel-smoke\Scripts\python.exe $wheel.FullName
          .wheel-smoke\Scripts\kgdistiller.exe --help
          .wheel-smoke\Scripts\python.exe -c "from importlib.resources import files; assert files('kgdistiller').joinpath('schemas/kgdistiller-ingest-request-v1.schema.json').is_file()"
          .wheel-smoke\Scripts\python.exe scripts/smoke_installed_runtime.py

  macos:
    needs: [dependency-resolution, obsidian-plugin]
    runs-on: macos-latest
    steps:
      - name: Use a temporary kgdistiller home, never the runner user's ~/.knowledge
        shell: bash
        run: echo "KGDISTILLER_HOME=$RUNNER_TEMP/kgdistiller-home" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - name: Download built Obsidian plugin
        uses: actions/download-artifact@v4
        with:
          name: kgdistiller-obsidian
          path: integrations/obsidian
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv run --locked python -m unittest discover -s tests -v
      - run: uv build --out-dir build/release
      - run: uv run --locked python scripts/check_distribution.py --dist-root build/release
      - name: Wheel smoke test
        run: |
          wheel=$(find build/release -name 'kgdistiller-*.whl' -print -quit)
          test -n "$wheel"
          uv venv .wheel-smoke
          uv pip install --python .wheel-smoke/bin/python "$wheel"
          .wheel-smoke/bin/kgdistiller --help
          .wheel-smoke/bin/python -c "from importlib.resources import files; assert files('kgdistiller').joinpath('schemas/kgdistiller-ingest-request-v1.schema.json').is_file()"
          .wheel-smoke/bin/python scripts/smoke_installed_runtime.py
