name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux-versions:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.15.1
      - run: uv run python -m unittest discover -s tests -v
      - run: uv build --out-dir build/release
      - run: uv run python scripts/check_distribution.py --dist-root build/release
      - name: Wheel smoke test
        run: |
          wheel=$(find build/release -name 'kgdistiller-*.whl' -print -quit)
          uv venv .wheel-smoke
          uv pip install --python .wheel-smoke/bin/python "$wheel"
          .wheel-smoke/bin/kgdistiller --help
          .wheel-smoke/bin/python -c "from importlib.resources import files; assert files('kgdistiller').joinpath('schemas/qlkg-ingest-request-v2.schema.json').is_file()"
          .wheel-smoke/bin/python scripts/smoke_installed_runtime.py

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Set up Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.15.1
      - run: uv run python -m unittest discover -s tests -v
      - run: uv build --out-dir build/release
      - run: uv run python scripts/check_distribution.py --dist-root build/release
      - name: Wheel smoke test
        shell: pwsh
        run: |
          $wheel = Get-ChildItem build/release -Filter 'kgdistiller-*.whl' | Select-Object -First 1
          if ($null -eq $wheel) { throw 'built wheel was not found' }
          uv venv .wheel-smoke
          uv pip install --python .wheel-smoke\Scripts\python.exe $wheel.FullName
          .wheel-smoke\Scripts\kgdistiller.exe --help
          .wheel-smoke\Scripts\python.exe -c "from importlib.resources import files; assert files('kgdistiller').joinpath('schemas/qlkg-ingest-request-v2.schema.json').is_file()"
          .wheel-smoke\Scripts\python.exe scripts/smoke_installed_runtime.py

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Set up Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.15.1
      - run: uv run python -m unittest discover -s tests -v
      - run: uv build --out-dir build/release
      - run: uv run python scripts/check_distribution.py --dist-root build/release
      - name: Wheel smoke test
        run: |
          wheel=$(find build/release -name 'kgdistiller-*.whl' -print -quit)
          test -n "$wheel"
          uv venv .wheel-smoke
          uv pip install --python .wheel-smoke/bin/python "$wheel"
          .wheel-smoke/bin/kgdistiller --help
          .wheel-smoke/bin/python -c "from importlib.resources import files; assert files('kgdistiller').joinpath('schemas/qlkg-ingest-request-v2.schema.json').is_file()"
          .wheel-smoke/bin/python scripts/smoke_installed_runtime.py
