[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "kgdistiller"
version = "3.0.0"
description = "Local-first academic research knowledge base: source-backed records and role-bound relations in Obsidian vaults, indexed in one SQLite file."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Qiulin Fan" }]
keywords = ["research", "knowledge-base", "obsidian", "retrieval", "agents"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
retrieval = [
  "torch>=2.6",
  "transformers==5.19.0",
  "sentencepiece==0.2.2",
  "huggingface-hub>=1.33,<2",
  "safetensors>=0.8,<0.9",
  "numpy>=2",
]

[dependency-groups]
dev = ["numpy>=2", "ruff==0.16.10"]

[project.urls]
Homepage = "https://github.com/qiulinfan/kgdistiller"
Repository = "https://github.com/qiulinfan/kgdistiller"
Issues = "https://github.com/qiulinfan/kgdistiller/issues"

[project.scripts]
kgdistiller = "kgdistiller.cli:main"
kgd = "kgdistiller.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kgdistiller"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "kgdistiller/product/skills"
"workflows" = "kgdistiller/product/workflows"
"templates/document-types" = "kgdistiller/product/templates/document-types"
".codex/agents" = "kgdistiller/product/.codex/agents"
".claude/agents" = "kgdistiller/product/.claude/agents"
"docs/product-workflows.md" = "kgdistiller/product/docs/product-workflows.md"
"docs/model.md" = "kgdistiller/product/docs/model.md"
"docs/retrieval.md" = "kgdistiller/product/docs/retrieval.md"
"docs/obsidian.md" = "kgdistiller/product/docs/obsidian.md"
"docs/deployment.md" = "kgdistiller/product/docs/deployment.md"
"integrations/obsidian/main.js" = "kgdistiller/obsidian_plugin/main.js"
"integrations/obsidian/manifest.json" = "kgdistiller/obsidian_plugin/manifest.json"
"integrations/obsidian/styles.css" = "kgdistiller/obsidian_plugin/styles.css"

[tool.hatch.build]
include = [
  "src/kgdistiller/**/*.py",
  "skills/**",
  "workflows/**",
  "templates/document-types/*.md",
  ".codex/agents/*.toml",
  ".claude/agents/*.md",
  "docs/product-workflows.md",
  "docs/model.md",
  "docs/retrieval.md",
  "docs/obsidian.md",
  "docs/deployment.md",
  "integrations/obsidian/main.js",
  "integrations/obsidian/manifest.json",
  "integrations/obsidian/styles.css",
]
