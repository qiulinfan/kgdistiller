[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "kgdistiller"
version = "0.4.0"
description = "Local-first agentic distillation of Markdown, Typst, and LaTeX sources into a source-backed knowledge graph."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Qiulin Fan" }]
keywords = ["knowledge-graph", "agents", "markdown", "typst", "latex"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.optional-dependencies]
paper = ["pdfplumber>=0.11,<1"]

[project.urls]
Homepage = "https://github.com/qiulinfan/kgdistiller"
Repository = "https://github.com/qiulinfan/kgdistiller"
Issues = "https://github.com/qiulinfan/kgdistiller/issues"

[project.scripts]
kgdistiller = "kgdistiller.cli:main"
kgd = "kgdistiller.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kgdistiller"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "kgdistiller/product/skills"
"workflows" = "kgdistiller/product/workflows"
".codex/agents" = "kgdistiller/product/.codex/agents"
"docs/product-workflows.md" = "kgdistiller/product/docs/product-workflows.md"
"scripts/link-codex-product.sh" = "kgdistiller/product/scripts/link-codex-product.sh"
"scripts/link-codex-product.ps1" = "kgdistiller/product/scripts/link-codex-product.ps1"
"integrations/obsidian/main.js" = "kgdistiller/obsidian_plugin/main.js"
"integrations/obsidian/manifest.json" = "kgdistiller/obsidian_plugin/manifest.json"
"integrations/obsidian/styles.css" = "kgdistiller/obsidian_plugin/styles.css"

[tool.hatch.build]
include = [
  "src/kgdistiller/**/*.py",
  "src/kgdistiller/schemas/*.json",
  "src/kgdistiller/static/*",
  "skills/**",
  "workflows/**",
  ".codex/agents/*.toml",
  "docs/product-workflows.md",
  "scripts/link-codex-product.sh",
  "scripts/link-codex-product.ps1",
  "integrations/obsidian/main.js",
  "integrations/obsidian/manifest.json",
  "integrations/obsidian/styles.css",
]
