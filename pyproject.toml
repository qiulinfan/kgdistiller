[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "kgdistiller"
version = "0.4.0"
description = "Local-first agentic distillation of registered text documents into a source-backed knowledge graph."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Qiulin Fan" }]
keywords = ["knowledge-graph", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.optional-dependencies]
retrieval = ["sentence-transformers==6.1.0"]

[dependency-groups]
dev = ["ruff==0.16.10"]

[project.urls]
Homepage = "https://github.com/qiulinfan/kgdistiller"
Repository = "https://github.com/qiulinfan/kgdistiller"
Issues = "https://github.com/qiulinfan/kgdistiller/issues"

[project.scripts]
kgdistiller = "kgdistiller.cli:main"
kgd = "kgdistiller.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kgdistiller"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "kgdistiller/product/skills"
"workflows" = "kgdistiller/product/workflows"
".codex/agents" = "kgdistiller/product/.codex/agents"
".claude/agents" = "kgdistiller/product/.claude/agents"
"docs/product-workflows.md" = "kgdistiller/product/docs/product-workflows.md"
"docs/concepts-and-relations.md" = "kgdistiller/product/docs/concepts-and-relations.md"
"docs/paper-sheets-upstream.md" = "kgdistiller/product/docs/paper-sheets-upstream.md"
"docs/obsidian-hidden-knowledge.md" = "kgdistiller/product/docs/obsidian-hidden-knowledge.md"
"docs/omp-compiled-tools.md" = "kgdistiller/product/docs/omp-compiled-tools.md"
"scripts/link-codex-product.sh" = "kgdistiller/product/scripts/link-codex-product.sh"
"scripts/link-codex-product.ps1" = "kgdistiller/product/scripts/link-codex-product.ps1"
"scripts/link-claude-product.sh" = "kgdistiller/product/scripts/link-claude-product.sh"
"scripts/link-claude-product.ps1" = "kgdistiller/product/scripts/link-claude-product.ps1"
"integrations/obsidian/main.js" = "kgdistiller/obsidian_plugin/main.js"
"integrations/obsidian/manifest.json" = "kgdistiller/obsidian_plugin/manifest.json"
"integrations/obsidian/styles.css" = "kgdistiller/obsidian_plugin/styles.css"
"integrations/omp/compiled_tools.ts" = "kgdistiller/product/integrations/omp/compiled_tools.ts"

[tool.hatch.build]
include = [
  "src/kgdistiller/**/*.py",
  "src/kgdistiller/schemas/*.json",
  "skills/**",
  "workflows/**",
  ".codex/agents/*.toml",
  ".claude/agents/*.md",
  "docs/product-workflows.md",
  "docs/concepts-and-relations.md",
  "docs/paper-sheets-upstream.md",
  "docs/obsidian-hidden-knowledge.md",
  "docs/omp-compiled-tools.md",
  "scripts/link-codex-product.sh",
  "scripts/link-codex-product.ps1",
  "scripts/link-claude-product.sh",
  "scripts/link-claude-product.ps1",
  "integrations/obsidian/main.js",
  "integrations/obsidian/manifest.json",
  "integrations/obsidian/styles.css",
  "integrations/omp/compiled_tools.ts",
]
